career-profile:
  title: Career Profile
  summary: |
    I'm a staff security engineer focused on designing excellent, human-centered systems through first-principles thinking and iterative execution. I work across teams to help organizations navigate complex security risks, shaping architectures, and enabling others to deliver resilient solutions.

