#Update all the sections by editing the data.yml file inside _data folder.
markdown: kramdown
highlighter: rouge
# permalink: /posts/:title.html

exclude: [
            "LICENSE",
            "README.md",
            "bin/",
            "s3_website.yml",
            "spec/",
            "Rakefile",
            "Gemfile*",
            "classProj/"
           ]

title: 'Braxton Ehle'
# resume_pdf: '/about/resume.pdf'

# online-cv settings

name: 'Braxton Ehle'
url: 'https://braxtonehle.com'

#change it according to your repository name
# disabling since we are using a custom domain
#baseurl: '/online-cv'

description: The hub for hubbub about Braxton Ehle
# Style will be applied only after restarting the build or serve. Just choose one of the options.
theme_skin: oceanstale # blue turquoise green berry orange ceramic teal oceanstale
chrome_mobile_color: "#2B6781" # use hex colors (ex:#1976d2) or leave empty if you don't want a color for chrome mobile searchbar

# Tracker
analytics:

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed # http://sass-lang.com/documentation/file.SASS_REFERENCE.html#output_style

# Build settings
compress-site: yes

encoding: "utf-8"
compress_html: # - http://jch.penibelst.de/
  clippings: all
  ignore:
    envs: development

# Development Settings
port: 4000
host: 0.0.0.0
safe: false
